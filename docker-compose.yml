services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/appdb
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672
      - JWT_SECRET=your_jwt_secret
      - STRIPE_PUBLISHABLE_KEY=pk_test_51ReXBn08p1kJLykgZcT9pbKQTsIgUowG8hmgqVNA2q7JjlUu2cjqs1081SfBQFfg4b5uFu8eJtF7yHQCUmEznTOm00t3Um7bgY
      - STRIPE_SECRET_KEY=sk_test_51ReXBn08p1kJLykgdV9T87rmOoYK2yMvjDDDdNO4UyMN7iFsDZu2dVmF9GDzAipum6wYCymYT6BnbW2SBOAwA7Ye00a24OvRNK
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build: ./worker
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/appdb
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./worker:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: